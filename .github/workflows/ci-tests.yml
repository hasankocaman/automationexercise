name: E2E Tests (Pull Request)

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ENABLE_PREMIUM: ${{ secrets.VITE_ENABLE_PREMIUM }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # `npm run test:e2e` artık ÖNCE tam `npm run build` koşturur (pretest:e2e)
      # ve testleri dev sunucusu yerine üretilen `dist/`e karşı (vite preview)
      # çalıştırır. Bu yüzden ayrı bir "Build" adımı YOK — olsaydı her koşumda
      # aynı build iki kez alınırdı. SEO / içerik bütünlüğü / mülakat denetimi
      # geçitleri build'in içinde olduğu için hâlâ testlerden önce koşuyor.
      - name: Build + Playwright E2E tests (dist üzerinde)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test-results (traces/screenshots/videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
